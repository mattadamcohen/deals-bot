name: Website (israelideals.com)
# Rebuilds the site from the bot's Telegram posts after every deals run, and on demand.
on:
  workflow_run:
    workflows: ["Amazon deals bot"]
    types: [completed]
  push:
    branches: [main]
    paths: ["site/template.html", "tools/site_build.py", "data/site_removed.json"]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python tools/site_build.py
      - name: Save the rolling deal store
        run: |
          git config user.name deals-bot && git config user.email deals-bot@users.noreply.github.com
          git add data/site_deals.json
          git diff --staged --quiet || (git commit -m "site: update deals" && (git push || (git pull --rebase -X theirs && git push)))
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with: { path: site/dist }
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
      # GitHub's Pages API sometimes can't see the artifact yet; wait and try again
      - if: steps.deploy.outcome == 'failure'
        run: sleep 45
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 90
      - if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
