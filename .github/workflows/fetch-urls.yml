name: Fetch image URLs
on:
  workflow_dispatch:
    inputs:
      pairs: { description: "name=url space-separated", required: true }
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - run: |
          mkdir -p data/ad
          for p in ${{ inputs.pairs }}; do n="${p%%=*}"; u="${p#*=}"; curl -sL -A "Mozilla/5.0" -o "data/ad/$n.jpg" "$u" && echo "$n $(stat -c%s data/ad/$n.jpg)"; done
          git config user.name deals-bot && git config user.email deals-bot@users.noreply.github.com
          git add data/ad && git commit -m "ad images" && (git push || (git pull --rebase -X theirs && git push))
