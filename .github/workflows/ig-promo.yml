name: Instagram promo post now
on:
  workflow_dispatch:
    inputs:
      theme: { description: "optional theme (brands, gadgets, under35, home, kids, beauty, blackfriday)", required: false, default: "" }
      args: { description: "extra args e.g. --ids a,b,c --palette pink-orange --w3 text_with_underscores", required: false, default: "" }
jobs:
  post:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python tools/ig_promo.py --now ${{ inputs.theme && format('--theme {0}', inputs.theme) || '' }} ${{ inputs.args }}
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
          ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
      - name: Save state
        if: always()
        run: |
          git config user.name deals-bot && git config user.email deals-bot@users.noreply.github.com
          git add data/ig_promo.json data/ig
          git diff --staged --quiet || (git commit -m "Instagram promo post" && (git push || (git pull --rebase -X theirs && git push)))
