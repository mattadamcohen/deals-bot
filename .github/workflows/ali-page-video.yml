name: AliExpress page video
on:
  workflow_dispatch:
    inputs:
      ids: { description: "product ids", required: true }
jobs:
  run:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python tools/ali_page_video.py
        env: { IDS: "${{ inputs.ids }}" }
      - run: |
          git config user.name deals-bot && git config user.email deals-bot@users.noreply.github.com
          git add data/ad/vopt && git commit -m "ali page video" && (git push || (git pull --rebase -X theirs && git push)) || true
