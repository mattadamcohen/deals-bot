name: Giveaway referral promo
on:
  workflow_dispatch:
    inputs:
      action: { description: "preview (to Matt) or publish (channel)", required: true, default: "preview" }
      arg: { description: "extra argument (e.g. message id to replace)", required: false, default: "" }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python tools/giveaway_promo.py ${{ inputs.action }} ${{ inputs.arg }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
