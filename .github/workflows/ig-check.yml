name: Instagram check
on:
  workflow_dispatch:
    inputs:
      ids: { description: "media ids", required: false, default: "" }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - run: pip install requests && python tools/ig_check.py ${{ inputs.ids }}
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
