name: Amazon deals bot
on:
  # Timing comes from cron-job.org (job "Deals bot (10 posts/day)"), which calls workflow_dispatch
  # at :05 past 8,9,11,12,14,16,18,19,20,21 Israel time. GitHub's own schedule was unreliable.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print posts, don't send)"
        type: boolean
        default: false
      category:
        description: "Only this category slug (e.g. toys-and-games). Empty = normal rotation"
        type: string
        default: ""
      min_discount:
        description: "Only post items with at least this % off"
        type: string
        default: "0"
      max_posts:
        description: "Max posts this run (empty = config default)"
        type: string
        default: ""
      backfill:
        description: "Save details/photo of already-posted ASINs (comma separated), no posting"
        type: string
        default: ""
      test_telegram:
        description: "Just send a test message to the channel"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: deals-bot

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get install -y -qq libfribidi0 libraqm0 > /dev/null || true
      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AMAZON_TAG: ${{ vars.AMAZON_TAG }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          CATEGORY: ${{ inputs.category }}
          MIN_DISCOUNT: ${{ inputs.min_discount }}
          MAX_POSTS: ${{ inputs.max_posts }}
          BACKFILL: ${{ inputs.backfill }}
        run: |
          if [ "${{ inputs.test_telegram }}" = "true" ]; then
            python bot.py --test-telegram
          else
            python bot.py
          fi

      - name: Make Instagram reel (every few posts)
        if: ${{ !inputs.dry_run && !inputs.test_telegram && !inputs.backfill }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python tools/reel.py --auto

      - name: Save what was posted
        if: always()
        run: |
          git config user.name "deals-bot"
          git config user.email "deals-bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || (git commit -m "Update posted items" && git push)

      - name: Keep reel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel
          path: reel-out/
          if-no-files-found: ignore
          retention-days: 14

      - name: Keep debug pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-pages
          path: debug/
          if-no-files-found: ignore
          retention-days: 5
