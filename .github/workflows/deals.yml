name: Amazon deals bot
on:
  # Timing comes from cron-job.org (job "Deals bot"), which calls workflow_dispatch every 15 minutes.
  # bot.py spreads ~20 posts/day evenly over 07:00-23:00 Israel time; reels/carousels have fixed daily slots.
  workflow_dispatch:
    inputs:
      store:
        description: "aliexpress = post an AliExpress deal now"
        required: false
        default: ""
      dry_run:
        description: "Dry run (print posts, don't send)"
        type: boolean
        default: false
      category:
        description: "Only this category slug (e.g. toys-and-games). Empty = normal rotation"
        type: string
        default: ""
      min_discount:
        description: "Only post items with at least this % off"
        type: string
        default: "0"
      keyword:
        description: "Only items whose title contains this word (e.g. lego)"
        type: string
        default: ""
      force:
        description: "Post now even if it's not this slot's turn"
        type: boolean
        default: false
      max_posts:
        description: "Max posts this run (empty = config default)"
        type: string
        default: ""
      backfill:
        description: "Save details/photo of already-posted ASINs (comma separated), no posting"
        type: string
        default: ""
      test_telegram:
        description: "Just send a test message to the channel"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: deals-bot

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get install -y -qq libfribidi0 libraqm0 > /dev/null || true
      - run: pip install -r requirements.txt
      - name: Restore Amazon session and product cache
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: amazon-${{ github.run_id }}
          restore-keys: amazon-

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
          ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
          STORE: ${{ inputs.store }}
          AMAZON_TAG: ${{ vars.AMAZON_TAG }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          CATEGORY: ${{ inputs.category }}
          MIN_DISCOUNT: ${{ inputs.min_discount }}
          MAX_POSTS: ${{ inputs.max_posts }}
          FORCE: ${{ inputs.force && '1' || '' }}
          KEYWORD: ${{ inputs.keyword }}
          BACKFILL: ${{ inputs.backfill }}
        run: |
          if [ "${{ inputs.test_telegram }}" = "true" ]; then
            python bot.py --test-telegram
          else
            python bot.py
          fi

      - name: Instagram carousel (daily slot)
        if: ${{ !inputs.dry_run && !inputs.test_telegram && !inputs.backfill }}
        continue-on-error: true
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python tools/ig_post.py

      - name: Instagram reel (twice-daily slots)
        if: ${{ !inputs.dry_run && !inputs.test_telegram && !inputs.backfill }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python tools/reel.py --auto

      - name: Keep Amazon session and product cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: amazon-${{ github.run_id }}

      - name: Save what was posted
        if: always()
        run: |
          git config user.name "deals-bot"
          git config user.email "deals-bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || (git commit -m "Update posted items" && (git push || (git pull --rebase -X theirs && git push) || (sleep 5 && git pull --rebase -X theirs && git push)))

      - name: Keep reel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel
          path: reel-out/
          if-no-files-found: ignore
          retention-days: 14

      - name: Keep debug pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-pages
          path: debug/
          if-no-files-found: ignore
          retention-days: 5
