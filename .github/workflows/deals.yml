name: Amazon deals bot

on:
  schedule:
    - cron: "7 5-19 * * *"   # every hour, roughly 07:00-22:00 Israel time
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print posts, don't send)"
        type: boolean
        default: false
      test_telegram:
        description: "Just send a test message to the channel"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: deals-bot

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AMAZON_TAG: ${{ vars.AMAZON_TAG }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: |
          if [ "${{ inputs.test_telegram }}" = "true" ]; then
            python bot.py --test-telegram
          else
            python bot.py
          fi

      - name: Save what was posted
        if: always()
        run: |
          git config user.name "deals-bot"
          git config user.email "deals-bot@users.noreply.github.com"
          git add data/state.json
          git diff --staged --quiet || (git commit -m "Update posted items" && git push)

      - name: Keep debug pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-pages
          path: debug/
          if-no-files-found: ignore
          retention-days: 5
