name: Ad assets
on:
  workflow_dispatch:
    inputs:
      queries: { description: 'JSON [[name, query, required word], ...]', required: false, default: "" }
      per_query: { description: "photos per query", required: false, default: "2" }
permissions: { contents: write }
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python tools/ad_assets.py
        env:
          ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
          ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
          AD_QUERIES: ${{ inputs.queries }}
          AD_PER_QUERY: ${{ inputs.per_query }}
      - run: |
          git config user.name "deals-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/ad && git commit -m "ad assets" && git pull --rebase -X theirs && git push || true
