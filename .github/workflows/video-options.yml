name: Video options
on:
  workflow_dispatch:
    inputs:
      kw: { description: "keywords separated by |", required: false, default: "" }
jobs:
  run:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python tools/video_options.py
        env:
          KW: ${{ inputs.kw }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
          ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
      - run: |
          git config user.name deals-bot && git config user.email deals-bot@users.noreply.github.com
          git add data/ad/vopt && git commit -m "video options" && (git push || (git pull --rebase -X theirs && git push))
