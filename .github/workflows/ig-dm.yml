name: Instagram comment replies
# Triggered every 15 minutes by cron-job.org (job "IG comment replies").
# It also kicks off the deals bot each time; bot.py decides whether a post is due (~20/day, 07:00-23:00).
on:
  workflow_dispatch:
    inputs:
      check_only:
        description: "Only list new comments, don't send DMs"
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency:
  group: ig-dm
jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Kick off the deals bot (it decides itself whether a post is due)
        if: ${{ !inputs.check_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deals.yml --ref main -R ${{ github.repository }} || true
      - uses: actions/checkout@v4
        with: { ref: main }  # latest data, not the snapshot from when the run was queued
      - run: pip install requests
      - name: Reply to comments
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python tools/ig_dm.py ${{ inputs.check_only && '--check' || '' }}
      - name: Remember handled comments
        if: always()
        run: |
          git config user.name "deals-bot"; git config user.email "deals-bot@users.noreply.github.com"
          git add data/ig_replied.json 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "IG replies" && (git push || (git pull --rebase -X theirs && git push) || (sleep 5 && git pull --rebase -X theirs && git push)))
