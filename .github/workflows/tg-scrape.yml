name: Telegram channel scrape
on:
  workflow_dispatch:
    inputs:
      channel: { description: "Public channel username", required: true }
      n: { description: "Posts", required: false, default: "100" }
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python tools/tg_scrape.py "${{ inputs.channel }}" "${{ inputs.n }}"
