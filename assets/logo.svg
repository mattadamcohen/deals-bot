<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#1F5BFF"/>
      <stop offset="0.6" stop-color="#0A3BC4"/>
      <stop offset="1" stop-color="#06247A"/>
    </radialGradient>
    <linearGradient id="tag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE14D"/>
      <stop offset="1" stop-color="#FF9F1C"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000830" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- sparkle dots -->
  <g fill="#FFFFFF" opacity="0.9">
    <path d="M235 290 l10 28 28 10 -28 10 -10 28 -10 -28 -28 -10 28 -10z"/>
    <path d="M780 700 l8 22 22 8 -22 8 -8 22 -8 -22 -22 -8 22 -8z"/>
    <circle cx="290" cy="800" r="7"/>
    <circle cx="735" cy="250" r="6"/>
  </g>

  <!-- flight path + plane = shipping to Israel -->
  <path d="M225 640 C 320 880, 720 880, 820 640" fill="none" stroke="#FFFFFF" stroke-width="12"
        stroke-linecap="round" stroke-dasharray="4 30" opacity="0.85"/>
  <g transform="translate(826 610) rotate(-60)">
    <path d="M0 -46 L22 34 L0 20 L-22 34 Z" fill="#FFFFFF"/>
  </g>

  <!-- price tag -->
  <g transform="translate(522 480) rotate(-10) scale(1.12)" filter="url(#shadow)">
    <path d="M-250 -125 H215 a35 35 0 0 1 35 35 V90 a35 35 0 0 1 -35 35 H-250 L-345 0 Z"
          fill="url(#tag)" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round"/>
    <circle cx="-262" cy="0" r="24" fill="#0A3BC4" stroke="#FFFFFF" stroke-width="8"/>
    <text x="-10" y="18" text-anchor="middle" font-family="Inter Display" font-weight="900"
          font-size="128" fill="#0A2A8F" letter-spacing="-2">IL</text>
    <text x="-10" y="92" text-anchor="middle" font-family="Inter Display" font-weight="900"
          font-size="62" fill="#0A2A8F" letter-spacing="6">DEALS</text>
    <!-- Star of David accent on the tag -->
    <g transform="translate(160 -8)" fill="none" stroke="#0A2A8F" stroke-width="9" stroke-linejoin="round">
      <path d="M0 -44 L38 22 H-38 Z"/>
      <path d="M0 44 L38 -22 H-38 Z"/>
    </g>
  </g>

  <!-- free shipping ribbon -->
  <g transform="translate(512 735)">
    <rect x="-200" y="-34" width="400" height="68" rx="34" fill="#FFFFFF"/>
    <text x="0" y="16" text-anchor="middle" font-family="Inter Display" font-weight="800"
          font-size="42" fill="#0A3BC4" letter-spacing="3">FREE SHIPPING</text>
  </g>
</svg>
